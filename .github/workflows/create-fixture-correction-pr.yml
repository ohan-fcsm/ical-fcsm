name: Create fixture correction PR

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, '### Clé du match')
    runs-on: ubuntu-latest
    steps:
      - name: Validate correction and open pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const section = title => {
              const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = body.match(new RegExp(`### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`));
              return match?.[1]?.trim() || '';
            };

            const fixtureKey = section('Clé du match');
            const valuesText = section('Valeurs à corriger (JSON)').replace(/^```json\s*|\s*```$/g, '').trim();
            const source = section('Source et motif');
            const allowedFields = new Set([
              'dateEvent', 'strTime', 'strHomeTeam', 'strAwayTeam', 'strVenue', 'strLeague', 'intRound',
              'idHomeTeam', 'idAwayTeam', 'idEvent', 'intHomeScore', 'intAwayScore', 'strStatus', 'strProgress',
              '_confirmed', '_confirmedSource', '_broadcaster', '_channel', '_channelExact', '_manualNote',
            ]);

            if (!/^J\d+-[a-z0-9-]+-[a-z0-9-]+$/.test(fixtureKey)) {
              core.setFailed('Clé de match invalide. Utilisez la clé exportée par l’outil local.');
              return;
            }
            let submitted;
            try { submitted = JSON.parse(valuesText); } catch {
              core.setFailed('Les valeurs à corriger ne sont pas un JSON valide.');
              return;
            }
            if (!submitted || Array.isArray(submitted) || typeof submitted !== 'object') {
              core.setFailed('Les valeurs à corriger doivent être un objet JSON.');
              return;
            }
            const invalid = Object.keys(submitted).filter(field => !allowedFields.has(field));
            if (invalid.length) {
              core.setFailed(`Champ(s) non autorisé(s) : ${invalid.join(', ')}`);
              return;
            }
            if (!Object.keys(submitted).length) {
              core.setFailed('Ajoutez au moins un champ à corriger.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'manual-overrides.json';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const data = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            const fixtures = Array.isArray(data.fixtures) ? data.fixtures : [];
            const index = fixtures.findIndex(item => item?.key === fixtureKey);
            const existing = index >= 0 ? (fixtures[index].values || {}) : {};
            const values = { ...existing };
            for (const [field, value] of Object.entries(submitted)) {
              if (value === null) delete values[field];
              else values[field] = value;
            }
            if (Object.keys(values).length) {
              const next = { key: fixtureKey, values };
              if (index >= 0) fixtures[index] = next;
              else fixtures.push(next);
            } else if (index >= 0) {
              fixtures.splice(index, 1);
            }
            const output = `${JSON.stringify({ version: 1, updatedAt: new Date().toISOString(), fixtures }, null, 2)}\n`;
            const branch = `admin/fixture-correction-${issue.number}`;
            const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: mainRef.data.object.sha });
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `fix: correct ${fixtureKey}`,
              content: Buffer.from(output).toString('base64'),
              sha: current.data.sha,
            });
            const pr = await github.rest.pulls.create({
              owner, repo, head: branch, base: 'main',
              title: `Correction calendrier : ${fixtureKey}`,
              body: `Closes #${issue.number}\n\nSource : ${source}\n\nCorrections proposées :\n\`\`\`json\n${JSON.stringify(submitted, null, 2)}\n\`\`\``,
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `Pull Request créée : ${pr.data.html_url}\n\nAucune modification n’a été appliquée à \`main\` : vérifiez puis fusionnez la PR.`,
            });
