name: Update Standings History

on:
  schedule:
    - cron: "0 21 * * *"   # 21h00 UTC = 23h00 CEST — après les matchs du soir
  workflow_dispatch:        # déclenchement manuel possible

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Update standings history
        env:
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          TEAM_ID_FCSM: "133708"
          LEAGUE_ID: "4401"
          SEASON: "2026-2027"
        run: node update-standings.js

      - name: Commit standings history if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add standings-history.json
          git diff --cached --quiet || git commit -m "chore: mise à jour classement L2 [$(date -u '+%Y-%m-%d')]"
          git push
